<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 36px; box-sizing: border-box;
    background: linear-gradient(135deg, #0b57d0, #1a73e8); color: #fff;
    font-family: "PingFang SC", "Hiragino Sans GB", sans-serif;
  }
  .top { display: flex; align-items: center; gap: 14px; }
  img { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: 1px; }
  .sub { font-size: 13px; opacity: .85; margin-top: 2px; }
  .flow { display: flex; align-items: center; gap: 10px; font-size: 15px; }
  .pill { background: rgba(255,255,255,.18); border-radius: 999px; padding: 6px 14px; }
  .pill.en { background: #fff; color: #0b57d0; font-weight: 600; font-family: -apple-system, sans-serif; }
</style>
</head>
<body>
  <div class="top">
    <img src="../icons/icon128.png" alt="">
    <div><h1>中译英回复</h1><div class="sub">for Gmail · DeepSeek</div></div>
  </div>
  <div class="flow"><span class="pill">中文写</span>→<span class="pill en">English sent</span></div>
</body>
</html>
